<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>wyden bet - Criar Conta</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; }
        h1,h2,h3,h4 { font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto; }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 flex items-center justify-center min-h-screen my-8 overflow-x-hidden relative">

    <div class="absolute top-[-10%] left-[-10%] w-[500px] h-[500px] bg-emerald-500/10 rounded-full blur-[120px] pointer-events-none"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-[500px] h-[500px] bg-emerald-500/5 rounded-full blur-[120px] pointer-events-none"></div>

    <div class="animate__animated animate__fadeInUp bg-zinc-900 p-8 rounded-2xl shadow-2xl w-full max-w-md border border-zinc-800/80 backdrop-blur-sm z-10 transition-all duration-300 hover:border-emerald-500/30">
        
        <div class="text-center mb-6">
            <h1 class="text-4xl font-black text-emerald-400 tracking-wider drop-shadow-[0_0_15px_rgba(52,211,153,0.3)] animate-pulse">
                wyden bet
            </h1>
            <p class="text-zinc-400 text-sm mt-2 font-medium tracking-wide">Crie sua conta acadêmica</p>
        </div>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div class="animate__animated animate__headShake bg-red-500/10 border border-red-500/30 text-red-400 p-3 rounded-xl mb-4 text-xs font-semibold flex items-center gap-2">
              <i class="fa-solid fa-triangle-exclamation text-sm"></i>
              <div>
                {% for message in messages %}
                  {{ message }}
                {% endfor %}
              </div>
            </div>
          {% endif %}
        {% endwith %}

        <form id="cadastroForm" action="/cadastro" method="POST" class="space-y-4">
            
            <div class="space-y-1">
                <label class="block text-xs font-semibold text-zinc-400 uppercase tracking-wider">Nome Completo</label>
                <div class="relative group">
                    <input type="text" name="nome" required placeholder="Seu nome completo"
                           class="w-full px-4 py-3 bg-zinc-950 border border-zinc-800 rounded-xl text-zinc-100 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500/20 transition-all duration-300 placeholder-zinc-700 text-sm">
                </div>
            </div>

            <div class="space-y-1">
                <label class="block text-xs font-semibold text-zinc-400 uppercase tracking-wider">Matrícula</label>
                <div class="relative group">
                    <input type="text" name="matricula" required placeholder="Ex: 123456789"
                           class="w-full px-4 py-3 bg-zinc-950 border border-zinc-800 rounded-xl text-zinc-100 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500/20 transition-all duration-300 placeholder-zinc-700 text-sm">
                </div>
            </div>

            <div class="space-y-1">
                <label class="block text-xs font-semibold text-zinc-400 uppercase tracking-wider">E-mail Acadêmico</label>
                <div class="relative group">
                    <input type="email" name="email" required placeholder="seu.nome@uniruy.edu.br"
                           class="w-full px-4 py-3 bg-zinc-950 border border-zinc-800 rounded-xl text-zinc-100 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500/20 transition-all duration-300 placeholder-zinc-700 text-sm">
                </div>
            </div>

            <div class="space-y-1">
                <label class="block text-xs font-semibold text-zinc-400 uppercase tracking-wider">Senha</label>
                <div class="relative group">
                    <input id="senhaInput" type="password" name="senha" required placeholder="No mínimo 6 caracteres"
                           class="w-full px-4 py-3 pr-12 bg-zinc-950 border border-zinc-800 rounded-xl text-zinc-100 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500/20 transition-all duration-300 text-sm">
                    
                    <button type="button" id="toggleSenha" class="absolute right-4 top-1/2 -translate-y-1/2 text-zinc-500 hover:text-emerald-400 transition-colors focus:outline-none">
                        <i class="fa-solid fa-eye" id="senhaIcon"></i>
                    </button>
                </div>
            </div>

            <button type="submit" id="btnSubmit"
                    class="w-full bg-emerald-500 hover:bg-emerald-400 text-zinc-950 font-extrabold py-3.5 mt-2 rounded-xl transition-all duration-300 shadow-lg shadow-emerald-500/10 hover:shadow-emerald-500/20 flex items-center justify-center gap-2 transform hover:-translate-y-0.5 active:translate-y-0 text-sm">
                <span id="btnText">Cadastrar e Entrar</span>
                <span id="btnSpinner" class="hidden animate-spin inline-block w-5 h-5 border-[3px] border-current border-t-transparent text-zinc-950 rounded-full" role="status" aria-label="loading"></span>
            </button>
        </form>

        <div class="flex justify-center items-center text-xs pt-5 mt-4 border-t border-zinc-800/60">
            <p class="text-zinc-400">
                Já tem uma conta? 
                <a href="/login" class="text-emerald-500 font-bold hover:underline ml-1 transition-all">Acesse o Painel</a>
            </p>
        </div>
    </div>

    <script>
        const toggleSenhaBtn = document.getElementById('toggleSenha');
        const senhaInput = document.getElementById('senhaInput');
        const senhaIcon = document.getElementById('senhaIcon');

        toggleSenhaBtn.addEventListener('click', () => {
            const isPassword = senhaInput.type === 'password';
            senhaInput.type = isPassword ? 'text' : 'password';
            senhaIcon.className = isPassword ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye';
        });

        const cadastroForm = document.getElementById('cadastroForm');
        const btnSubmit = document.getElementById('btnSubmit');
        const btnText = document.getElementById('btnText');
        const btnSpinner = document.getElementById('btnSpinner');

        cadastroForm.addEventListener('submit', (e) => {
            btnSubmit.disabled = true;
            btnSubmit.classList.add('opacity-80', 'cursor-not-allowed');
            btnText.textContent = 'Criando conta...';
            btnSpinner.classList.remove('hidden');
        });
    </script>
</body>
</html>
