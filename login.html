<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wyden Bet - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; }
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-20px); } 100% { transform: translateY(0px); } }
        .animate-float { animation: float 4s ease-in-out infinite; }
        
        /* Luz de fundo muito mais suave */
        .bg-subtle-glow { 
            background-color: #09090b;
            background-image: radial-gradient(at 20% 30%, rgba(16, 185, 129, 0.08) 0px, transparent 50%),
                              radial-gradient(at 80% 70%, rgba(5, 150, 105, 0.05) 0px, transparent 50%);
        }
    </style>
</head>
<body class="bg-subtle-glow text-zinc-100 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-5xl bg-zinc-900/90 backdrop-blur-md rounded-3xl overflow-hidden flex shadow-2xl border border-zinc-800">
        
        <div class="w-full md:w-1/2 p-12 flex flex-col justify-center">
            <h1 class="text-3xl font-black mb-8 text-emerald-400">Wyden Bet</h1>
            <h2 class="text-2xl font-bold mb-6">Acesse sua conta</h2>

            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    {% for message in messages %}
                        <div class="bg-red-500/10 border border-red-500/20 text-red-400 text-xs p-3 rounded-lg mb-4">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form action="/login" method="POST" class="space-y-4">
                <div class="space-y-1">
                    <label class="text-xs font-bold text-zinc-400 uppercase">Matricula ou E-mail</label>
                    <input type="text" name="usuario" required placeholder="Digite seu acesso" 
                           class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-4 py-3 text-sm outline-none focus:border-emerald-500 transition">
                </div>

                <div class="space-y-1">
                    <div class="flex justify-between items-center">
                        <label class="text-xs font-bold text-zinc-400 uppercase">Senha</label>
                        <a href="#" class="text-xs text-emerald-400 hover:underline">Esqueci minha senha</a>
                    </div>
                    <div class="relative">
                        <input type="password" id="input-senha" name="senha" required placeholder="Digite a senha" 
                               class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-4 py-3 text-sm outline-none focus:border-emerald-500 transition">
                        <button type="button" id="toggle-password" class="absolute right-4 top-3.5 text-zinc-500">
                            <i id="icone-olho" class="fa-solid fa-eye text-sm"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-400 text-zinc-950 font-black py-3.5 rounded-lg transition mt-4">Entrar</button>
                <a href="/cadastro" class="block w-full text-center border border-zinc-800 hover:bg-zinc-800 font-bold py-3.5 rounded-lg transition">Criar conta</a>
            </form>
        </div>

        <div class="hidden md:flex w-1/2 bg-emerald-600/10 p-12 flex-col justify-center items-center text-center relative overflow-hidden">
            <div class="relative z-10 flex flex-col items-center">
                <h3 class="text-2xl font-black mb-4">App da Wyden Bet</h3>
                <p class="text-lg font-bold mb-8 max-w-xs text-zinc-400">Faça o download agora e comece a diversão!</p>
                
                <div class="w-48 h-64 bg-zinc-900 rounded-3xl border border-zinc-800 shadow-2xl mb-8 flex items-center justify-center animate-float relative">
                    <i class="fa-solid fa-graduation-cap text-5xl text-emerald-500"></i>
                </div>

                <button class="bg-zinc-800 text-white px-8 py-3 rounded-full font-bold mb-6 hover:bg-zinc-700 transition flex items-center gap-2">
                    Baixar aplicativo <i class="fa-solid fa-download"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const toggle = document.getElementById('toggle-password');
            const inputSenha = document.getElementById('input-senha');
            const iconeOlho = document.getElementById('icone-olho');

            if (toggle) {
                toggle.addEventListener('click', function () {
                    const isPassword = inputSenha.getAttribute('type') === 'password';
                    inputSenha.setAttribute('type', isPassword ? 'text' : 'password');
                    iconeOlho.className = isPassword ? 'fa-solid fa-eye-slash text-sm' : 'fa-solid fa-eye text-sm';
                });
            }
        });
    </script>
</body>
</html>
