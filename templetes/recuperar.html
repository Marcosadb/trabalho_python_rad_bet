<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniBet - Recuperar Senha</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; }
        h1,h2,h3,h4 { font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto; }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 flex items-center justify-center h-screen overflow-hidden relative">

    <div class="absolute top-[-10%] left-[-10%] w-[500px] h-[500px] bg-emerald-500/10 rounded-full blur-[120px] pointer-events-none"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-[500px] h-[500px] bg-emerald-500/5 rounded-full blur-[120px] pointer-events-none"></div>

    <div class="animate__animated animate__fadeInUp bg-zinc-900 p-8 rounded-2xl shadow-2xl w-full max-w-md border border-zinc-800/80 backdrop-blur-sm z-10 transition-all duration-300 hover:border-emerald-500/30">
        
        <div class="text-center mb-6">
            <h1 class="text-4xl font-black text-emerald-400 tracking-wider drop-shadow-[0_0_15px_rgba(52,211,153,0.3)] animate-pulse">
                UniBet
            </h1>
            <h2 class="text-zinc-200 text-lg font-bold mt-4">Recuperar Senha</h2>
            <p class="text-zinc-400 text-xs mt-1 max-w-xs mx-auto leading-relaxed">
                Insira sua matrícula ou e-mail cadastrado para redefinir sua credencial de acesso.
            </p>
        </div>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div class="animate__animated animate__headShake bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 p-3 rounded-xl mb-4 text-xs font-semibold flex items-center gap-2">
              <i class="fa-solid fa-circle-info text-sm text-emerald-400"></i>
              <div>
                {% for message in messages %}
                  {{ message }}
                {% endfor %}
              </div>
            </div>
          {% endif %}
        {% endwith %}

        <form id="recuperarForm" action="/recuperar-senha" method="POST" class="space-y-6">
            
            <div class="space-y-2">
                <label class="block text-xs font-semibold text-zinc-400 uppercase tracking-wider">Matrícula ou E-mail Acadêmico</label>
                <div class="relative group">
                    <input type="text" id="usuarioInput" name="usuario" required placeholder="Ex: seu.nome@uniruy.edu.br"
                           class="w-full px-4 py-3.5 bg-zinc-950 border border-zinc-800 rounded-xl text-zinc-100 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500/20 transition-all duration-300 placeholder-zinc-700 text-sm">
                </div>
            </div>

            <button type="submit" id="btnSubmit"
                    class="w-full bg-emerald-500 hover:bg-emerald-400 text-zinc-950 font-extrabold py-4 rounded-xl transition-all duration-300 shadow-lg shadow-emerald-500/10 hover:shadow-emerald-500/20 flex items-center justify-center gap-2 transform hover:-translate-y-0.5 active:translate-y-0 text-sm">
                <span id="btnText">Resetar Minha Senha</span>
                <span id="btnSpinner" class="hidden animate-spin inline-block w-5 h-5 border-[3px] border-current border-t-transparent text-zinc-950 rounded-full" role="status" aria-label="loading"></span>
            </button>
        </form>

        <div class="flex justify-center items-center text-xs pt-5 mt-6 border-t border-zinc-800/60">
            <a href="/login" class="text-zinc-400 hover:text-emerald-400 transition-colors duration-200 font-medium flex items-center gap-2">
                <i class="fa-solid fa-arrow-left text-[10px]"></i> Voltar para o Login
            </a>
        </div>
    </div>

    <script>
        const recuperarForm = document.getElementById('recuperarForm');
        const btnSubmit = document.getElementById('btnSubmit');
        const btnText = document.getElementById('btnText');
        const btnSpinner = document.getElementById('btnSpinner');

        recuperarForm.addEventListener('submit', (e) => {
            btnSubmit.disabled = true;
            btnSubmit.classList.add('opacity-80', 'cursor-not-allowed');
            btnText.textContent = 'Enviando...';
            btnSpinner.classList.remove('hidden');
        });
    </script>
</body>
</html>
